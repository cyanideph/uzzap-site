name: Publish Uzzap APK

on:
  push:
    paths:
      - .github/workflows/publish-uzzap-apk.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download built APK artifact
        run: |
          curl -fL 'https://sdmntprindiasocentral.oaiusercontent.com/files/00000000-8798-8211-af71-1acf446d8f12/raw?se=2026-09-18T08%3A49%3A19Z&sp=r&sv=2026-02-06&sr=b&scid=fc59753e-327f-5f45-8a3a-d941edb85123&skoid=45d5558d-260a-4eed-aec4-6bc512bdfda4&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-18T05%3A57%3A29Z&ske=2026-09-19T05%3A57%3A29Z&sks=b&skv=2026-02-06&sig=Hf038Sfotv9Ph%2FSFOrF7w2nVs3SxIPI4smjrNaes7U4%3D' -o /tmp/uzzap-debug.zip
          unzip -o /tmp/uzzap-debug.zip -d /tmp/uzzap-apk
          test -f /tmp/uzzap-apk/app-debug.apk
          cp /tmp/uzzap-apk/app-debug.apk uzzap-debug.apk
      - name: Publish APK
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uzzap-debug.apk
          git commit -m "Publish latest Uzzap debug APK" || echo "APK unchanged"
          git push
